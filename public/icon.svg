<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0E1628" />
      <stop offset="100%" stop-color="#090D16" />
    </linearGradient>
    <linearGradient id="skyGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="bullGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
  </defs>

  <!-- Rounded Obsidian App Tile -->
  <rect x="0" y="0" width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="10" y="10" width="492" height="492" rx="104" fill="none" stroke="#1E293B" stroke-width="6" />

  <!-- Subtle Precision Reticle Corners -->
  <path d="M96 144 V104 H136" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M416 144 V104 H376" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M96 368 V408 H136" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />
  <path d="M416 368 V408 H376" fill="none" stroke="#38BDF8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" opacity="0.85" />

  <!-- Horizontal BOS / Entry Structure Line -->
  <line x1="108" y1="248" x2="404" y2="248" stroke="#38BDF8" stroke-width="6" stroke-dasharray="14 10" opacity="0.55" />

  <!-- Candlestick 1 (Bearish Pullback) -->
  <line x1="168" y1="216" x2="168" y2="356" stroke="#64748B" stroke-width="10" stroke-linecap="round" />
  <rect x="148" y="250" width="40" height="72" rx="8" fill="#475569" />

  <!-- Candlestick 2 (Displacement Impulse) -->
  <line x1="256" y1="158" x2="256" y2="338" stroke="#38BDF8" stroke-width="10" stroke-linecap="round" />
  <rect x="234" y="196" width="44" height="106" rx="9" fill="url(#skyGrad)" />

  <!-- Candlestick 3 (Bullish Breakout) -->
  <line x1="344" y1="122" x2="344" y2="280" stroke="#34D399" stroke-width="10" stroke-linecap="round" />
  <rect x="322" y="148" width="44" height="96" rx="9" fill="url(#bullGrad)" />
</svg>
